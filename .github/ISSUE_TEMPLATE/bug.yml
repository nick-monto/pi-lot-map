name: Bug
description: The map shows something wrong, or does not show at all
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste command lines, prompts or file contents that hold anything private: the name of the tool or of the command is enough.
        A security problem does not go here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what the map showed, and what you expected it to show. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: lot-map version
      description: From `claude plugin list`, or the top of CHANGELOG.md in your copy.
      placeholder: 0.5.3
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: From `claude --version`.
      placeholder: 2.1.321
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Desktop app
        - Terminal
        - VS Code
        - JetBrains
        - Other
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: macOS 26, Windows 11, Ubuntu 24.04
  - type: textarea
    id: options
    attributes:
      label: Options you changed
      description: Only the ones that differ from the defaults, such as `language` or `theme`.

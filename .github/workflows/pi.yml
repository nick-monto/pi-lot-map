# The pi and omp extension's tests, under Bun: they import `bun:test`, which the Claude plugin's own
# test harness does not allow, so they are kept out of its `.test.ts` pattern and run here.
name: pi

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: pi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Test
        run: bun test pi
